<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
</head>
<body>
  <button id="kakao-share-btn" style="font-size:20px;padding:20px;">🎲 가챠판 공유하기</button>

  <script>
    Kakao.init('여기_JS키');

    document.getElementById('kakao-share-btn').addEventListener('click', function() {
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: '🎲 이환 보드 주사위 가챠 시스템',
          description: '[이환 - 스카버러 마켓 보드]\n아래 버튼 중 원하는 컬러를 골라 터치해 보세요!',
          imageUrl: 'https://raw.githack.com/eunsung82909473-art/yukari-nte-cards/main/board.png',
          link: {
            mobileWebUrl: 'https://eunsung82909473-art.github.io/yukari-nte-cards/',
            webUrl: 'https://eunsung82909473-art.github.io/yukari-nte-cards/'
          }
        },
        buttons: [
          {
            title: '🔴 빨간주사위',
            link: {
              mobileWebUrl: 'https://eunsung82909473-art.github.io/yukari-nte-cards/red.html',
              webUrl: 'https://eunsung82909473-art.github.io/yukari-nte-cards/red.html'
            }
          },
          {
            title: '🔵 파란주사위',
            link: {
              mobileWebUrl: 'https://eunsung82909473-art.github.io/yukari-nte-cards/blue.html',
              webUrl: 'https://eunsung82909473-art.github.io/yukari-nte-cards/blue.html'
            }
          }
        ]
      });
    });
  </script>
</body>
</html>
