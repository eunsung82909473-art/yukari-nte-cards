<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이환 주사위 굴리기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #191919;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .dice {
      font-size: 100px;
      margin-bottom: 20px;
    }
    #status {
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.6;
      color: #cccccc;
    }
    .roll-btn {
      font-size: 22px;
      font-weight: bold;
      padding: 18px 40px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    }
    #btn-red { background: #ff4d4d; }
    #btn-blue { background: #4da6ff; margin-top: 16px; }
    .hint {
      margin-top: 24px;
      font-size: 13px;
      color: #888888;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <div class="dice" id="dice-icon">🎲</div>
  <div id="status">아래 버튼을 누르면 채팅방으로<br>주사위 굴리기 명령어가 전송됩니다.</div>

  <button class="roll-btn" id="btn-red">🔴 빨간주사위 굴리기</button>
  <button class="roll-btn" id="btn-blue">🔵 파란주사위 굴리기</button>

  <div class="hint">
    버튼이 안 눌리면 카카오톡 채팅창으로 돌아가서<br>
    "!빨간주사위 굴리기" 또는 "!파란주사위 굴리기"를<br>
    직접 입력해주세요.
  </div>

  <script>
    function sendToChat(command) {
      // 카카오톡 채팅창에 텍스트를 채워넣는 딥링크
      var url = "kakaotalk://sendtext?text=" + encodeURIComponent(command);
      window.location.href = url;
    }

    document.getElementById('btn-red').addEventListener('click', function () {
      sendToChat("!빨간주사위 굴리기");
    });

    document.getElementById('btn-blue').addEventListener('click', function () {
      sendToChat("!파란주사위 굴리기");
    });

    // URL에 ?action=roll&color=red(or blue) 가 붙어서 들어온 경우, 바로 자동 전송
    var params = new URLSearchParams(window.location.search);
    if (params.get('action') === 'roll') {
      var color = params.get('color') || 'red';
      var command = color === 'blue' ? "!파란주사위 굴리기" : "!빨간주사위 굴리기";
      document.getElementById('status').innerHTML = "잠시 후 자동으로 명령어를 전송합니다...";
      setTimeout(function () {
        sendToChat(command);
      }, 400);
    }
  </script>
</body>
</html>
