<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이환 주사위 굴리기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #191919;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .dice {
      font-size: 100px;
      margin-bottom: 20px;
    }
    #status {
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.6;
      color: #cccccc;
    }
    a.roll-btn {
      display: block;
      width: 260px;
      font-size: 22px;
      font-weight: bold;
      padding: 18px 0;
      border-radius: 14px;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }
    #btn-red { background: #ff4d4d; }
    #btn-blue { background: #4da6ff; margin-top: 16px; }
    .hint {
      margin-top: 24px;
      font-size: 13px;
      color: #888888;
      max-width: 320px;
    }
    .copy-hint {
      margin-top: 18px;
      font-size: 13px;
      color: #666666;
    }
  </style>
</head>
<body>

  <div class="dice">🎲</div>
  <div id="status">버튼을 눌러 채팅방으로<br>주사위 굴리기 명령어를 보내주세요.</div>

  <a class="roll-btn" id="btn-red" href="#">🔴 빨간주사위 굴리기</a>
  <a class="roll-btn" id="btn-blue" href="#">🔵 파란주사위 굴리기</a>

  <div class="hint">
    버튼이 안 눌리면 카카오톡 채팅창으로 돌아가서<br>
    "!빨간주사위 굴리기" 또는 "!파란주사위 굴리기"를<br>
    직접 입력해주세요.
  </div>

  <script>
    var btnRed = document.getElementById('btn-red');
    var btnBlue = document.getElementById('btn-blue');

    btnRed.href = "kakaotalk://sendtext?text=" + encodeURIComponent("!빨간주사위 굴리기");
    btnBlue.href = "kakaotalk://sendtext?text=" + encodeURIComponent("!파란주사위 굴리기");
  </script>
</body>

</html>
