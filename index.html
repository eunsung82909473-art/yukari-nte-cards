<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이환 주사위 굴리기</title>
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"
    integrity="sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVWlChEuu4jK2vxfAAD0eZxzCKakxg55G4"
    crossorigin="anonymous"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #191919;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .dice { font-size: 100px; margin-bottom: 20px; }
    #status {
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.6;
      color: #cccccc;
    }
    button.roll-btn {
      display: block;
      width: 260px;
      font-size: 22px;
      font-weight: bold;
      padding: 18px 0;
      border-radius: 14px;
      color: #ffffff;
      border: none;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      box-sizing: border-box;
      cursor: pointer;
    }
    #btn-red { background: #ff4d4d; }
    #btn-blue { background: #4da6ff; margin-top: 16px; }
    .hint {
      margin-top: 24px;
      font-size: 13px;
      color: #888888;
      max-width: 320px;
    }
  </style>
</head>
<body>

  <div class="dice">🎲</div>
  <div id="status">버튼을 누르면 카카오 공유창이 열려요.<br>보낼 채팅방을 선택하면 자동 전송됩니다.</div>

  <button class="roll-btn" id="btn-red">🔴 빨간주사위 굴리기</button>
  <button class="roll-btn" id="btn-blue">🔵 파란주사위 굴리기</button>

  <div class="hint">
    공유창이 안 뜨면 카카오톡 인앱 브라우저가 아닌<br>
    일반 브라우저(Safari/Chrome)로 열어보세요.
  </div>

  <script>
    // ⚠️ 카카오 디벨로퍼스 > 내 애플리케이션 > 앱 키 > JavaScript 키
    var KAKAO_JS_KEY = "b97c8c393dce8ade36638c1364e44d3e";

    Kakao.init(KAKAO_JS_KEY);

    // ⚠️ 도구 > 메시지 템플릿에서 확인한 template_id 숫자를 넣어주세요
    var KAKAO_TEMPLATE_ID = 135888;

    // ⚠️ 빨간/파란 주사위 각각 쓸 이미지 주소를 넣어주세요 (raw.githack 주소 권장)
    // 나중에 원하는 이미지로 바꿔도 됩니다. 지금은 임시 주사위 이미지로 채워뒀어요.
    var RED_DICE_IMG = "https://raw.githack.com/eunsung82909473-art/yukari-nte-cards/main/ae2d26193deabf3233489c18f72eea65a2121a2558a7e7867983ce2dd332a737.webp";
    var BLUE_DICE_IMG = "https://raw.githack.com/eunsung82909473-art/yukari-nte-cards/main/dc2a9c5f0f1bc232f94861985fe5080c1451b031715eb3a275dc1d43522af422.webp";

    function sendDiceMessage(command, imageUrl) {
      Kakao.Share.sendCustom({
        templateId: KAKAO_TEMPLATE_ID,
        templateArgs: {
          GACHA_DESC: command,
          CHARACTER_NAME: "이환",
          IMG_URL: imageUrl
        }
      });
    }

    document.getElementById('btn-red').addEventListener('click', function () {
      sendDiceMessage("!빨간주사위 굴리기", RED_DICE_IMG);
    });

    document.getElementById('btn-blue').addEventListener('click', function () {
      sendDiceMessage("!파란주사위 굴리기", BLUE_DICE_IMG);
    });
  </script>
</body>

</html>
